# file.encoding 을 UTF-8 이 아니라 네이티브(MS949)로 둔다. 이유가 있다.
#
# 이 PC 의 사용자 홈은 C:\Users\사용자 로 한글이 들어 있고, Gradle 캐시가 그 아래 있다.
# 테스트 워커를 띄울 때 Gradle 은 클래스패스를 argfile 에 써서 `java @argfile` 로 넘기는데,
# 데몬이 UTF-8 로 쓰면 java 런처는 그 파일을 네이티브 인코딩(MS949)으로 읽는다.
# 그 결과 한글이 들어간 jar 경로가 전부 깨져 워커가 클래스패스를 잃고
# ClassNotFoundException: GradleWorkerMain 으로 죽는다.
#
# GRADLE_USER_HOME 이나 -g 로는 해결되지 않는다. argfile 경로는 user.home 에서 나오고,
# C:\workAndroid\gradle-user-ascii 는 C:\Users\사용자\.gradle 를 가리키는 정션이라 같은 곳이다.
# 데몬 기본 인코딩을 네이티브로 맞추는 것이 이 환경에서 가장 확실한 해법이다.
# (Kotlin 컴파일러는 소스를 항상 UTF-8 로 읽으므로 한글 주석·테스트명에는 영향이 없다.)
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=MS949

org.gradle.configuration-cache=true
org.gradle.java.home=C:/Program Files/Android/Android Studio/jbr
kotlin.code.style=official
